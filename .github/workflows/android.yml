name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev \
            libffi-dev uuid-dev tar libtool autoconf automake
          pip install --upgrade pip
          pip install --user --upgrade buildozer cython virtualenv

      - name: Force Install Aidl & Build-Tools
        run: |
          # Wir suchen den sdkmanager und akzeptieren ALLES
          SDK_PATH="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          # 1. Lizenzen mit "yes" durchwinken
          yes | $SDK_PATH --licenses || true
          
          # 2. Build-Tools MANUELL INSTALLIEREN (hier steckt aidl drin!)
          echo "Installiere Build-Tools 34.0.0..."
          $SDK_PATH --install "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          
          # 3. Den Pfad für Buildozer sichtbar machen
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Wir nutzen -v (verbose), damit wir sehen, was er tut
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLIP-IT-Debug-APK
          path: bin/*.apk

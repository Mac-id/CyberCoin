name: Android Build

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            git \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            m4 \
            ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libsqlite3-dev sqlite3 \
            bzip2 libbz2-dev libssl-dev \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev \
            libffi-dev uuid-dev \
            openjdk-17-jdk

          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython virtualenv

      - name: Build APK
        run: |
          buildozer -v android debug
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "True"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cybercoin-apk
          path: bin/*.apk

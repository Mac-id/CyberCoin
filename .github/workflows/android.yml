name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev \
            libffi-dev uuid-dev tar libtool autoconf automake openjdk-17-jdk
          pip install --upgrade pip
          pip install --user --upgrade buildozer cython virtualenv

      - name: Force Install Aidl & Fix Paths
        run: |
          # SDK Manager finden
          SDK_PATH="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          # 1. Lizenzen akzeptieren
          yes | $SDK_PATH --licenses || true
          
          # 2. Build-Tools 34.0.0 installieren (enthält aidl)
          $SDK_PATH --install "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          
          # 3. Den Pfad für aidl global verfügbar machen
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          
          # 4. Der ultimative Fix: Symlink erstellen, falls Buildozer im falschen Ordner sucht
          sudo ln -s $ANDROID_HOME/build-tools/34.0.0/aidl /usr/local/bin/aidl || true

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Wir sagen Buildozer explizit, wo das SDK liegt
          export ANDROIDSDK=$ANDROID_HOME
          export ANDROIDNDK=$ANDROID_HOME/ndk-bundle
          
          buildozer -v android debug
        env:
          # Diese Variablen helfen Buildozer, die Tools zu finden
          ACCEPT_SDK_LICENSE: "True"
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLIP-IT-Debug-APK
          path: bin/*.apk

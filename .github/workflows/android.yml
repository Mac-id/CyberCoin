name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 setuptools

      - name: Accept Android Licenses
        run: |
          # Akzeptiert alle Lizenzen für das vorinstallierte SDK im Runner
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME

      - name: Build with Buildozer
        run: |
          # Wir löschen alte Fehlversuche, um sauber zu starten
          rm -rf .buildozer
          buildozer android debug
        env:
          BUILDOZER_ALLOW_ORG_PROJECT_ROOT: 1
          # Wir verlinken auf das existierende SDK im Runner (spart 10 Min Downloadzeit)
          ANDROID_SDK_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk-bundle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberCoin-App
          path: bin/*.apk

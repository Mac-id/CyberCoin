name: Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Erlaubt es dir, die Action manuell über die GitHub-Oberfläche zu starten!

jobs:
  build:
    runs-on: ubuntu-22.04 # WICHTIG: Auf 22.04 pinnen, damit libncurses5 für aidl verfügbar ist

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          
          # Hinzufügen der essenziellen Android-Build-Tool Abhängigkeiten (libncurses5, libtinfo5)
          sudo apt-get install -y \
            build-essential git ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libsqlite3-dev sqlite3 \
            bzip2 libbz2-dev libssl-dev \
            libgdbm-dev liblzma-dev libreadline-dev libffi-dev \
            autoconf automake libtool libtool-bin libltdl-dev pkg-config zip unzip \
            libncurses5 libtinfo5 cmake

          pip install --upgrade pip
          
          # Cython Restriktion entfernt, da Kivy 2.3.1 Cython 3.x benötigt
          pip install buildozer cython virtualenv setuptools

      - name: Build APK with Buildozer
        run: |
          # Du brauchst den Cache in der Action nicht löschen, der Server ist eh bei jedem Lauf frisch.
          buildozer -v android debug
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "True"
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberCoin-APK
          path: bin/*.apk

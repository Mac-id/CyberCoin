name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev \
            libffi-dev uuid-dev tar
          pip install --upgrade pip
          pip install --user --upgrade buildozer cython virtualenv

      - name: Install Android SDK & Accept Licenses
        run: |
          # SDK Manager finden und Lizenzen akzeptieren
          # Wir nutzen 'yes', um alle Abfragen mit 'y' zu beantworten
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true
          
          # Sicherstellen, dass die Build-Tools installiert werden
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build with Buildozer
        run: |
          # Pfad für Buildozer setzen
          export PATH=$PATH:$HOME/.local/bin
          # Buildozer ausführen (Log-Level 2 für Details bei Fehlern)
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLIP-IT-Debug-APK
          path: bin/*.apk

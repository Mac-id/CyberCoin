name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev \
            libffi-dev uuid-dev tar libtool autoconf automake openjdk-17-jdk
          pip install --upgrade pip
          pip install --user --upgrade buildozer cython virtualenv

      - name: Accept Licenses and Set Paths
        run: |
          # 1. Lizenzen im System-SDK akzeptieren
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # 2. Build-Tools 34.0.0 explizit im System-SDK installieren
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0" "platforms;android-34"

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          
          # DIESE EXPORTS SIND ENTSCHEIDEND:
          # Wir biegen Buildozer auf das vorinstallierte GitHub SDK um
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROIDSDK=$ANDROID_SDK_ROOT
          
          # Wir sagen Buildozer, er soll KEIN eigenes SDK installieren
          buildozer -v android debug
        env:
          # Zusätzliche Sicherheit für Kivy/p4a
          APP_ANDROID_ACCEPT_SDK_LICENSE: "True"
          # Wir nutzen das NDK, das GitHub bereitstellt (spart Zeit und Platz)
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}

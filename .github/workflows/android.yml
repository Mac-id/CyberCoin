name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev \
            libffi-dev uuid-dev tar libtool autoconf automake openjdk-17-jdk
          pip install --upgrade pip
          pip install --user --upgrade buildozer cython virtualenv

      - name: Pre-install Build-Tools and Accept Licenses
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          # 1. Alle Lizenzen für das gesamte SDK vorab akzeptieren
          yes | $SDK_MANAGER --licenses || true
          
          # 2. Die Problem-Version 37-rc2 UND die stabile 34 manuell installieren
          echo "Installiere Build-Tools..."
          $SDK_MANAGER --install "build-tools;37.0.0-rc2" "build-tools;34.0.0" "platforms;android-34"
          
          # 3. Aidl global verlinken, falls Buildozer es nicht findet
          sudo ln -s $ANDROID_HOME/build-tools/34.0.0/aidl /usr/local/bin/aidl || true

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Buildozer zwingen, das existierende SDK zu nutzen
          buildozer -v android debug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          # Verhindert, dass Buildozer selbst nochmal nach Lizenzen fragt
          APP_ANDROID_ACCEPT_SDK_LICENSE: "True"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLIP-IT-Debug-APK
          path: bin/*.apk

name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 setuptools

      - name: Force Install and Link Aidl (Fixed)
        run: |
          # 1. SDK Pfade
          SDK_MANAGER=$(find $ANDROID_HOME -name "sdkmanager" | grep "cmdline-tools" | head -n 1)
          
          # 2. Lizenzen und Build-Tools 34 (Stabil)
          yes | $SDK_MANAGER --licenses --sdk_root=$ANDROID_HOME
          $SDK_MANAGER "build-tools;34.0.0" "platforms;android-34" "platform-tools" --sdk_root=$ANDROID_HOME
          
          # 3. Zielordner für Buildozer vorbereiten
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0
          
          # 4. DIE DATEI FINDEN (Nur die ausführbare Datei, keine Ordner!)
          # Wir suchen spezifisch im build-tools Ordner nach der binären Datei 'aidl'
          REAL_AIDL=$(find $ANDROID_HOME/build-tools/34.0.0 -name "aidl" -type f | head -n 1)
          
          # 5. Kopieren mit Gewalt (Force)
          cp -f $REAL_AIDL /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0/
          
          # 6. Berechtigungen setzen
          chmod +x /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl

      - name: Build with Buildozer
        run: |
          # Wir zwingen Buildozer das globale SDK zu erkennen
          buildozer android debug
        env:
          BUILDOZER_ALLOW_ORG_PROJECT_ROOT: 1
          # Diese Envs sagen Buildozer: "Guck hier zuerst!"
          ANDROID_SDK_PATH: /usr/local/lib/android/sdk
          ANDROID_NDK_PATH: /usr/local/lib/android/sdk/ndk-bundle
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberCoin-App
          path: bin/*.apk

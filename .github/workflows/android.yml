name: Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          
          sudo apt-get install -y \
            build-essential git ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libsqlite3-dev sqlite3 \
            bzip2 libbz2-dev libssl-dev \
            libgdbm-dev liblzma-dev libreadline-dev libffi-dev \
            autoconf automake libtool libtool-bin libltdl-dev pkg-config zip unzip \
            libncurses5 libtinfo5 cmake

          pip install --upgrade pip
          
          pip install "buildozer>=1.5.0" "Cython==0.29.33" virtualenv setuptools

      - name: Pre-download freetype (Bypass Savannah Server Crash)
        run: |
          echo "Lade freetype vom stabilen GNU Mirror herunter..."
          mkdir -p .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype
          curl -L -o .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype/freetype-2.10.1.tar.gz https://ftp.gnu.org/gnu/freetype/freetype-2.10.1.tar.gz
          
          # Zur Sicherheit auch in den alternativen Cache-Ordner legen
          mkdir -p ~/.local/share/python-for-android/packages/freetype
          curl -L -o ~/.local/share/python-for-android/packages/freetype/freetype-2.10.1.tar.gz https://ftp.gnu.org/gnu/freetype/freetype-2.10.1.tar.gz

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "True"
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK als GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberCoin-APK
          path: bin/*.apk
          retention-days: 7

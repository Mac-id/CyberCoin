name: Android Build

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libsqlite3-dev sqlite3 \
            bzip2 libbz2-dev libssl-dev \
            libgdbm-dev liblzma-dev libreadline-dev libffi-dev \
            openjdk-17-jdk \
            autoconf automake libtool libtool-bin libltdl-dev pkg-config zip unzip

          pip install --upgrade pip
          # Fix: Cython < 3.0 und setuptools Limitierung für Ubuntu 24.04 Stabilität
          pip install "buildozer>=1.5.0" "cython<3.0.0" "setuptools<70.0.0" virtualenv

      - name: Build APK
        run: |
          # Vorherige Build-Reste entfernen, um Pfad-Konflikte zu vermeiden
          rm -rf .buildozer
          
          # Compiler-Flags zurücksetzen, um den __GNUC_PREREQ Fehler zu verhindern
          export CFLAGS=""
          export CXXFLAGS=""
          
          buildozer -v android debug
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "True"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberCoin-Debug-APK
          path: bin/*.apk

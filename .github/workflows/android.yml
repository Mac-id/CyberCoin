name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    # Wir wechseln zurück auf 22.04 für maximale Kompatibilität mit Android-NDK-Builds
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt update
          # Vollständiges Paket-Set für Kivy/Android
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libcanberra-gtk-module
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 setuptools

      - name: Build with Buildozer
        run: |
          # Wir bauen im "Warn-Modus", um zu sehen, was passiert
          buildozer android debug
        env:
          BUILDOZER_ALLOW_ORG_PROJECT_ROOT: 1
          # Wir setzen den Pfad explizit, falls Buildozer verwirrt ist
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberCoin-App
          path: bin/*.apk

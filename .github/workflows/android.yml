name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3 python3-dev \
            ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev \
            libffi-dev uuid-dev tar libtool autoconf automake
          pip install --upgrade pip
          pip install --user --upgrade buildozer cython virtualenv

      - name: Accept Android SDK Licenses
        run: |
          # Wir nutzen den Pfad, in dem das SDK auf GitHub Runnern standardmäßig liegt
          # Der 'yes'-Befehl sorgt für die Bestätigung aller Lizenzen
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Optional: Falls 'latest' nicht existiert, versuchen wir den Fallback
          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
          fi

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Wir erzwingen hier KEIN Update der SDK-Lizenzen innerhalb von Buildozer, 
          # da wir es bereits im Schritt zuvor erledigt haben.
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLIP-IT-Debug-APK
          path: bin/*.apk

name: Android Build

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libsqlite3-dev sqlite3 \
            bzip2 libbz2-dev libssl-dev \
            libgdbm-dev liblzma-dev libreadline-dev libffi-dev \
            autoconf automake libtool libtool-bin libltdl-dev pkg-config zip unzip

          pip install --upgrade pip
          # WICHTIG: Wir erzwingen Cython < 3.0, um den "long" Fehler zu umgehen
          pip install "buildozer>=1.5.0" "Cython<3.0" "setuptools<70.0.0" virtualenv

      - name: Build APK
        run: |
          # Wir löschen alle Reste von vorherigen Fehlversuchen
          rm -rf .buildozer
          
          # Sicherstellen, dass keine störenden Pfade gesetzt sind
          unset CPATH
          unset C_INCLUDE_PATH
          unset CPLUS_INCLUDE_PATH
          unset OBJC_INCLUDE_PATH
          unset LD_LIBRARY_PATH
          unset LIBRARY_PATH
          
          export APP_ANDROID_ACCEPT_SDK_LICENSE=True
          # Wir geben buildozer explizit Zeit und Infos
          buildozer -v android debug
        env:
          BUILDZER_WARN_ON_ROOT: 1

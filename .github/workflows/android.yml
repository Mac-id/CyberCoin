name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 setuptools

      - name: Deep Fix SDK Structure
        run: |
          # 1. Erstelle die antike Ordnerstruktur, die Buildozer so liebt
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          
          # 2. Lade die echten Command Line Tools von Google
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip
          
          # 3. Kopiere den sdkmanager in den "alten" Pfad UND den neuen
          cp -r cmdline-tools/* ~/.buildozer/android/platform/android-sdk/tools/
          # Fix für die seltsame Google-Ordnerstruktur
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          cp -r cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/

          # 4. Lizenzen vorab akzeptieren
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb74f50229d759a1c04d\n24333f8a63b6825e11c210439401614f1659a721" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Build with Buildozer
        run: |
          # Wir löschen den Cache, falls Buildozer sich was falsches gemerkt hat
          buildozer android debug
        env:
          BUILDOZER_ALLOW_ORG_PROJECT_ROOT: 1
